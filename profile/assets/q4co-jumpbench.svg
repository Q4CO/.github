<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
  <title id="title">JumpBench 跳跃能力评测示意</title>
  <desc id="desc">同一起点 x0 经跳跃算子 J 产生候选解 y，再由固定修复与局部搜索 D 得到 x1。示例中 x1 比 x0 更好，但尚未达到全局最优。曲线仅为示意，不是实测能量景观，横向位置不代表汉明距离。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#000"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#000}
      .k{font-size:17px;font-weight:600;letter-spacing:2px}.h{font-size:32px;font-weight:700}.t{font-size:23px;font-weight:700}.b{font-size:19px}.m{font-size:17px}
    </style>
  </defs>
  <rect width="1120" height="670" fill="#fff"/>
  <text x="48" y="40" class="k">Q4CO / JUMPBENCH</text>
  <text x="48" y="87" class="h">跳得更远，不等于跳得更好</text>
  <rect x="48" y="113" width="1024" height="66" rx="12" fill="#000"/>
  <text x="560" y="155" text-anchor="middle" style="fill:#fff;font-size:23px;font-weight:600">同一起点池　+　同一修复与局部搜索　+　明确的总预算</text>

  <path d="M73 535V216M73 535H1050" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M73 238V216" fill="none" stroke="#000" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="91" y="224" class="b">目标值</text>
  <text x="91" y="250" class="m">越低越好</text>

  <path d="M120 276C170 280 164 384 238 384C298 384 301 265 364 265C432 265 463 455 566 455C642 455 658 361 726 361C792 361 808 493 886 493C955 493 961 404 1025 428" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M238 373C253 200 414 199 467 375" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="288" y="221" class="t">跳跃提议 J</text>

  <circle cx="238" cy="384" r="8" fill="#000"/>
  <text x="238" y="426" text-anchor="middle" class="t">局部极小值 x₀</text>
  <text x="238" y="454" text-anchor="middle" class="m">按认证距离分层：10 / 20 / 30</text>

  <circle cx="470" cy="388" r="8" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="478" y="302" class="t">候选解 y</text>
  <path d="M487 313L473 372" fill="none" stroke="#000" stroke-width="1.3"/>

  <path d="M486 392C508 420 533 440 553 444" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="584" y="316" class="t">统一后处理 D</text>
  <text x="584" y="343" class="m">可行性修复 + 局部搜索</text>
  <path d="M596 352L535 419" fill="none" stroke="#000" stroke-width="1.3"/>
  <circle cx="566" cy="455" r="8" fill="#000"/>
  <text x="566" y="497" text-anchor="middle" class="t">更优落点 x₁</text>

  <path d="M886 481L890 489L900 490L892 496L895 506L886 500L877 506L880 496L872 490L882 489Z" fill="#000"/>
  <text x="886" y="421" text-anchor="middle" class="t">全局最优参考</text>
  <path d="M886 431V476" fill="none" stroke="#000" stroke-width="1.3"/>
  <text x="1050" y="562" text-anchor="end" class="m">配置空间的示意投影 · 非汉明距离轴</text>

  <rect x="48" y="580" width="1024" height="48" rx="10" fill="#fff" stroke="#000" stroke-width="1.7"/>
  <text x="72" y="612" class="t">评价对象：x₀ → J(x₀) = y → D(y) = x₁　｜　看改进，也看全部成本</text>
  <text x="48" y="654" class="m">概念示意，非实测曲线；示例路径不保证跳跃成功，全局最优参考仅在可认证时使用。</text>
</svg>
