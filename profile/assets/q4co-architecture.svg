<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
  <title id="title">Q4CO 规划架构</title>
  <desc id="desc">产业、随机与硬件原生数据集进入统一主库。主库连接算法、执行后端、实验协议、指标与资源评估，输出性能差距、跳跃收益和硬件需求。这是规划结构，不是已发布功能清单。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#000"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#000}
      .k{font-size:17px;font-weight:600;letter-spacing:2px}.h{font-size:32px;font-weight:700}.s{font-size:21px;font-weight:700}.t{font-size:25px;font-weight:700}.b{font-size:19px}.m{font-size:17px}
      .box{fill:#fff;stroke:#000;stroke-width:2}.flow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="830" fill="#fff"/>
